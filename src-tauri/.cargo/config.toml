# Cargo target 配置（当前为**空配置**，所有行都是注释）。
#
# 历史：这里曾硬编码 `C:\Users\vanem\.rustup\...\gcc-ld`，换机器/换用户名后
# 链接必然失败。后来为绕开"本机没有 MinGW"试过 `linker = "rust-lld"` +
# `link-self-contained=yes` + `-C dlltool=<替身>`，但 **对 Tauri 这种链接大量
# Windows 系统库的工程不成立**：rustc 的 self-contained 只带 Rust 运行库
# （lib/rustlib/x86_64-pc-windows-gnu/lib 下仅 1 个 .a），没有 kernel32 /
# user32 / ole32 的导入库，链接阶段会缺符号。
#
# 结论：windows-gnu target 需要**真正的 MinGW**（gcc + dlltool + windres +
# 导入库）。由 scripts/build-env.ps1 把 MinGW 的 bin 注入 PATH 并钉住
# CC_x86_64_pc_windows_gnu，cargo/rustc 走标准路径即可，本文件不需要任何内容。
#
# 换到 MSVC 工具链时本文件同样不需要内容（可整目录删除）。
