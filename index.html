<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        var mqlDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = localStorage.getItem('cailens-theme');
        var dark = theme === 'dark' || ((theme === 'auto' || !theme) && mqlDark);
        if (dark) document.documentElement.classList.add('dark');
        var font  = localStorage.getItem('cailens-font');  if (font)  document.documentElement.setAttribute('data-font', font);
        var style = localStorage.getItem('cailens-style'); if (style) document.documentElement.setAttribute('data-style', style);
        var scale = localStorage.getItem('cailens-scale'); if (scale) document.documentElement.setAttribute('data-scale', scale);
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CaILens</title>
    <style>
      /* ── Critical splash tokens (mirrors src/styles/tokens.css 实际生效值) ── */
      :root {
        --splash-bg:              #F2EEE3;
        --splash-text:            #2B2620;
        --splash-text-tertiary:   #A39B87;
        --splash-accent:          #BC4A26;
      }
      .dark {
        --splash-bg:              #1a1a1a;
        --splash-text:            #ededed;
        --splash-text-tertiary:   #5a5a5a;
        --splash-accent:          #c48a78;
      }

      /* ── Splash layout ── */
      #splash-screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: var(--splash-bg);
        z-index: 9999;
        transition: opacity 200ms ease-out;
      }

      #splash-screen.splash-fade-out {
        opacity: 0;
        pointer-events: none;
      }

      /* ── Content(延迟浮现) ──
         启动足够快(<300ms)时用户只看到一块与应用同色的背景,任何"加载中"
         元素都不出现;只有超过 300ms(冷启动)才浮现呼吸圆点。 */
      .splash-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        opacity: 0;
        animation: splash-reveal 300ms ease-out 300ms forwards;
      }

      @keyframes splash-reveal {
        to { opacity: 1; }
      }

      /* 启动失败:立即显示内容与错误文案,不受延迟影响 */
      #splash-screen.splash-error .splash-content {
        opacity: 1;
        animation: none;
      }

      /* ── Brand mark ── */
      .splash-mark {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background-color: var(--splash-accent);
      }

      @media (prefers-reduced-motion: no-preference) {
        .splash-mark {
          animation: splash-pulse 2s ease-in-out infinite;
        }
        @keyframes splash-pulse {
          0%, 100% { transform: scale(1);   opacity: 0.75; }
          50%      { transform: scale(1.5); opacity: 1;    }
        }
      }

      /* ── Error label(平时为空,不可见) ── */
      .splash-label {
        margin-top: 20px;
        font-size: 12px;
        font-weight: 400;
        color: var(--splash-text-tertiary);
        letter-spacing: 0.02em;
        text-align: center;
        max-width: 320px;
        min-height: 18px;
        user-select: none;
      }

      #splash-screen.splash-error .splash-label {
        color: var(--splash-text);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="splash-screen">
      <div class="splash-content">
        <div class="splash-mark"></div>
        <div class="splash-label" id="splash-label"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
